<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokéBastion TD — Tactical Prototype</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-alt: #1c222b;
        --border: #30363d;
        --border-hi: #484f58;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --green: #3fb950;
        --amber: #d29922;
        --red: #f85149;
        --purple: #bc8cff;
        --gold: #f7cc45;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.4;
        overflow: auto;
      }

      #app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px;
        gap: 10px;
      }

      #top-bar {
        width: 1236px;
        max-width: 100%;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .top-group {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .brand {
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.04em;
        color: var(--text);
        text-transform: uppercase;
      }

      .stat-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        font-variant-numeric: tabular-nums;
      }

      .stat-label {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .stat-val {
        font-weight: 600;
        color: var(--text);
      }

      .stat-val.gold {
        color: var(--gold);
      }

      .stat-val.ap {
        color: var(--accent);
      }

      .phase-badge {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel-alt);
      }

      .phase-PREP {
        color: var(--accent);
        border-color: rgba(88, 166, 255, 0.45);
        background: rgba(88, 166, 255, 0.12);
      }

      .phase-COMBAT {
        color: var(--red);
        border-color: rgba(248, 81, 73, 0.45);
        background: rgba(248, 81, 73, 0.12);
      }

      .phase-REWARD {
        color: var(--gold);
        border-color: rgba(247, 204, 69, 0.45);
        background: rgba(247, 204, 69, 0.12);
      }

      .phase-VICTORY {
        color: var(--green);
        border-color: rgba(63, 185, 80, 0.45);
        background: rgba(63, 185, 80, 0.12);
      }

      .phase-DEFEAT {
        color: var(--red);
        border-color: rgba(248, 81, 73, 0.45);
        background: rgba(248, 81, 73, 0.12);
      }

      .core-meter {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .core-bar-wrap {
        width: 110px;
      }

      #main-area {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      #phaser-host {
        width: 864px;
        height: 576px;
        flex-shrink: 0;
        background: #11161d;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #side-panel {
        width: 360px;
        height: 576px;
        flex-shrink: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .status-banner {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 12px;
        color: var(--text);
      }

      .card {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      .btn {
        appearance: none;
        background: #21262d;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s, opacity 0.12s;
      }

      .btn:hover:not(:disabled) {
        background: #2c333d;
        border-color: var(--border-hi);
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-primary {
        background: #238636;
        border-color: #2ea043;
        color: #ffffff;
      }

      .btn-primary:hover:not(:disabled) {
        background: #2ea043;
        border-color: #3fb950;
      }

      .btn-accent {
        background: rgba(88, 166, 255, 0.16);
        border-color: rgba(88, 166, 255, 0.55);
        color: var(--accent);
      }

      .btn-accent:hover:not(:disabled) {
        background: rgba(88, 166, 255, 0.25);
      }

      .btn-ult {
        background: rgba(188, 140, 255, 0.18);
        border-color: rgba(188, 140, 255, 0.6);
        color: var(--purple);
      }

      .btn-ult:hover:not(:disabled) {
        background: rgba(188, 140, 255, 0.28);
      }

      .btn-danger {
        background: rgba(248, 81, 73, 0.15);
        border-color: rgba(248, 81, 73, 0.5);
        color: var(--red);
      }

      .btn-danger:hover:not(:disabled) {
        background: rgba(248, 81, 73, 0.25);
      }

      .btn-wave {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        letter-spacing: 0.03em;
      }

      .btn-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .btn-row > .btn {
        flex: 1;
      }

      .tool-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .tool-btn {
        text-align: left;
        padding: 7px 8px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        cursor: pointer;
      }

      .tool-btn:hover {
        border-color: var(--border-hi);
        background: #21262d;
      }

      .tool-btn.active {
        border-color: var(--accent);
        background: rgba(88, 166, 255, 0.14);
      }

      .tool-btn.unaffordable {
        opacity: 0.65;
      }

      .tool-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 4px;
        font-weight: 600;
        font-size: 12px;
      }

      .tool-cost {
        color: var(--gold);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .tool-desc {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.25;
      }

      .bar-track {
        width: 100%;
        height: 7px;
        background: #0d1117;
        border: 1px solid var(--border);
        border-radius: 999px;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        transition: width 0.12s linear;
      }

      .bar-hp {
        background: var(--green);
      }

      .bar-core {
        background: #38bdf8;
      }

      .bar-ult {
        background: var(--purple);
      }

      .bar-row {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .bar-labels {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .unit-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .unit-name-wrap {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.35);
        flex-shrink: 0;
      }

      .tag {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--muted);
      }

      .tag.fainted {
        color: var(--red);
        border-color: rgba(248, 81, 73, 0.5);
      }

      .tag.ruined {
        color: var(--amber);
        border-color: rgba(210, 153, 34, 0.5);
      }

      .desc-box {
        font-size: 11px;
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .desc-box strong {
        color: var(--text);
      }

      .toggle-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
        user-select: none;
      }

      .chips-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .unit-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 8px;
        border-radius: 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
      }

      .unit-chip:hover:not(:disabled) {
        border-color: var(--border-hi);
        background: #21262d;
      }

      .unit-chip.selected {
        border-color: var(--accent);
        background: rgba(88, 166, 255, 0.15);
      }

      .unit-chip.fainted {
        opacity: 0.55;
        border-style: dashed;
        border-color: rgba(248, 81, 73, 0.55);
      }

      .unit-chip.reserve {
        border-style: dashed;
      }

      .unit-chip:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .chip-hp {
        font-size: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .badge-list {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .relic-badge {
        font-size: 11px;
        padding: 3px 7px;
        border-radius: 5px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
      }

      .relic-badge.artifact {
        border-color: rgba(247, 204, 69, 0.45);
        color: var(--gold);
      }

      .relic-badge.upgrade {
        border-color: rgba(88, 166, 255, 0.45);
        color: var(--accent);
      }

      #modal-root:empty {
        display: none;
      }

      #modal-root {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(1, 4, 9, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .modal-card {
        width: 100%;
        max-width: 720px;
        background: var(--panel);
        border: 1px solid var(--border-hi);
        border-radius: 10px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }

      .modal-card.compact {
        max-width: 520px;
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .modal-title {
        font-size: 18px;
        font-weight: 700;
      }

      .reward-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .reward-card {
        text-align: left;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        color: var(--text);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: border-color 0.12s, transform 0.12s;
      }

      .reward-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      .reward-title {
        font-size: 14px;
        font-weight: 700;
      }

      .reward-desc {
        font-size: 12px;
        color: var(--muted);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .stat-box {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 10px;
        text-align: center;
      }

      .stat-box-val {
        font-size: 18px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .credits-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .credit-item {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .credit-item a {
        color: var(--accent);
        text-decoration: none;
        word-break: break-all;
        font-size: 12px;
      }

      .credit-item a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="top-bar"></header>
      <main id="main-area">
        <div id="phaser-host"></div>
        <aside id="side-panel"></aside>
      </main>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
