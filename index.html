<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokéBastion TD — Tactical Prototype</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-alt: #1c222b;
        --border: #30363d;
        --border-hi: #484f58;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --green: #3fb950;
        --amber: #d29922;
        --red: #f85149;
        --purple: #bc8cff;
        --gold: #f7cc45;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        font-size: 13px;
        line-height: 1.4;
        overflow: hidden;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
      }

      #top-bar {
        position: fixed;
        top: 10px;
        left: 10px;
        right: 326px;
        z-index: 20;
        background: rgba(22, 27, 34, 0.88);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }

      .top-group {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .brand {
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.04em;
        color: var(--text);
        text-transform: uppercase;
      }

      .stat-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        font-variant-numeric: tabular-nums;
      }

      .stat-label {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .stat-val {
        font-weight: 600;
        color: var(--text);
      }

      .stat-val.gold {
        color: var(--gold);
      }

      .stat-val.ap {
        color: var(--accent);
      }

      .phase-badge {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel-alt);
      }

      .phase-PREP {
        color: var(--accent);
        border-color: rgba(88, 166, 255, 0.45);
        background: rgba(88, 166, 255, 0.12);
      }

      .phase-COMBAT {
        color: var(--red);
        border-color: rgba(248, 81, 73, 0.45);
        background: rgba(248, 81, 73, 0.12);
      }

      .phase-REWARD {
        color: var(--gold);
        border-color: rgba(247, 204, 69, 0.45);
        background: rgba(247, 204, 69, 0.12);
      }

      .phase-VICTORY {
        color: var(--green);
        border-color: rgba(63, 185, 80, 0.45);
        background: rgba(63, 185, 80, 0.12);
      }

      .phase-DEFEAT {
        color: var(--red);
        border-color: rgba(248, 81, 73, 0.45);
        background: rgba(248, 81, 73, 0.12);
      }

      .core-meter {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .core-bar-wrap {
        width: 110px;
      }

      #main-area {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #phaser-host {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #11161d;
        overflow: hidden;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #side-panel {
        position: fixed;
        top: 10px;
        right: 10px;
        bottom: 10px;
        width: 306px;
        z-index: 20;
        background: rgba(22, 27, 34, 0.88);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }

      .status-banner {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 12px;
        color: var(--text);
      }

      .card {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      .btn {
        appearance: none;
        background: #21262d;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.12s,
          border-color 0.12s,
          opacity 0.12s;
      }

      .btn:hover:not(:disabled) {
        background: #2c333d;
        border-color: var(--border-hi);
      }

      .btn:focus-visible,
      .tool-btn:focus-visible,
      .unit-chip:focus-visible,
      .reward-card:focus-visible,
      input[type='checkbox']:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-xs {
        padding: 3px 8px;
        font-size: 11px;
        flex-shrink: 0;
      }

      .active-mode-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 7px;
        border: 1px solid rgba(88, 166, 255, 0.55);
        background: rgba(88, 166, 255, 0.13);
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
      }

      .active-mode-bar.ult {
        border-color: rgba(188, 140, 255, 0.6);
        background: rgba(188, 140, 255, 0.15);
      }

      .active-mode-bar.sell {
        border-color: rgba(248, 81, 73, 0.55);
        background: rgba(248, 81, 73, 0.13);
      }

      .active-mode-text {
        min-width: 0;
        line-height: 1.3;
      }

      .btn-primary {
        background: #238636;
        border-color: #2ea043;
        color: #ffffff;
      }

      .btn-primary:hover:not(:disabled) {
        background: #2ea043;
        border-color: #3fb950;
      }

      .btn-accent {
        background: rgba(88, 166, 255, 0.16);
        border-color: rgba(88, 166, 255, 0.55);
        color: var(--accent);
      }

      .btn-accent:hover:not(:disabled) {
        background: rgba(88, 166, 255, 0.25);
      }

      .btn-ult {
        background: rgba(188, 140, 255, 0.18);
        border-color: rgba(188, 140, 255, 0.6);
        color: var(--purple);
      }

      .btn-ult:hover:not(:disabled) {
        background: rgba(188, 140, 255, 0.28);
      }

      .btn-danger {
        background: rgba(248, 81, 73, 0.15);
        border-color: rgba(248, 81, 73, 0.5);
        color: var(--red);
      }

      .btn-danger:hover:not(:disabled) {
        background: rgba(248, 81, 73, 0.25);
      }

      .btn-wave {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        letter-spacing: 0.03em;
      }

      .btn-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .btn-row > .btn {
        flex: 1;
      }

      .tool-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .tool-btn {
        text-align: left;
        padding: 7px 8px;
        display: flex;
        align-items: center;
        gap: 7px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        cursor: pointer;
        transition:
          border-color 0.12s,
          background 0.12s;
      }

      .tool-btn:hover {
        border-color: var(--border-hi);
        background: #21262d;
      }

      .tool-btn.active {
        border-color: var(--accent);
        background: rgba(88, 166, 255, 0.14);
      }

      .tool-btn.active-danger {
        border-color: var(--red);
        background: rgba(248, 81, 73, 0.15);
      }

      .tool-btn.unaffordable {
        opacity: 0.65;
      }

      .tool-icon {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 5px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
      }

      .tool-icon svg {
        width: 16px;
        height: 16px;
        display: block;
      }

      .tool-meta {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .tool-name {
        font-weight: 600;
        font-size: 11.5px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tool-cost {
        color: var(--gold);
        font-size: 11px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .tool-cost.free {
        color: var(--accent);
      }

      .tool-cost.refund {
        color: var(--amber);
      }

      .tool-btn.unaffordable .tool-cost {
        color: var(--red);
      }

      .shop-tooltip {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 9px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        min-height: 58px;
      }

      .shop-tooltip-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        font-weight: 700;
        color: var(--text);
      }

      .shop-tooltip-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
      }

      .shop-need {
        color: var(--red);
        font-weight: 600;
      }

      .tool-desc {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.25;
      }

      .bar-track {
        width: 100%;
        height: 7px;
        background: #0d1117;
        border: 1px solid var(--border);
        border-radius: 999px;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        transition: width 0.12s linear;
      }

      .bar-hp {
        background: var(--green);
      }

      .bar-core {
        background: #38bdf8;
      }

      .bar-ult {
        background: var(--purple);
      }

      .bar-row {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .bar-labels {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .unit-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .unit-name-wrap {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.35);
        flex-shrink: 0;
      }

      .tag {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--muted);
      }

      .tag.fainted {
        color: var(--red);
        border-color: rgba(248, 81, 73, 0.5);
      }

      .tag.ruined {
        color: var(--amber);
        border-color: rgba(210, 153, 34, 0.5);
      }

      .desc-box {
        font-size: 11px;
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .desc-box strong {
        color: var(--text);
      }

      .unit-stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
      }

      .unit-stat {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 4px 5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        font-variant-numeric: tabular-nums;
      }

      .unit-stat-lbl {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      .unit-stat-val {
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
      }

      .toggle-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
        user-select: none;
      }

      .chips-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .unit-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 8px;
        border-radius: 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
      }

      .unit-chip:hover:not(:disabled) {
        border-color: var(--border-hi);
        background: #21262d;
      }

      .unit-chip.selected {
        border-color: var(--accent);
        background: rgba(88, 166, 255, 0.15);
      }

      .unit-chip.fainted {
        opacity: 0.55;
        border-style: dashed;
        border-color: rgba(248, 81, 73, 0.55);
      }

      .unit-chip.reserve {
        border-style: dashed;
      }

      .unit-chip:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .chip-hp {
        font-size: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .ult-pip {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 1px 4px;
        border-radius: 4px;
        color: var(--purple);
        background: rgba(188, 140, 255, 0.16);
        border: 1px solid rgba(188, 140, 255, 0.55);
      }

      .badge-list {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .relic-badge {
        font-size: 11px;
        padding: 3px 7px;
        border-radius: 5px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
      }

      .relic-badge.artifact {
        border-color: rgba(247, 204, 69, 0.45);
        color: var(--gold);
      }

      .relic-badge.upgrade {
        border-color: rgba(88, 166, 255, 0.45);
        color: var(--accent);
      }

      #modal-root:empty {
        display: none;
      }

      #modal-root {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(1, 4, 9, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .modal-card {
        width: 100%;
        max-width: 720px;
        background: var(--panel);
        border: 1px solid var(--border-hi);
        border-radius: 10px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }

      .modal-card.compact {
        max-width: 520px;
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .modal-title {
        font-size: 18px;
        font-weight: 700;
      }

      .reward-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .reward-card {
        text-align: left;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        color: var(--text);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition:
          border-color 0.12s,
          transform 0.12s;
      }

      .reward-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      .reward-title {
        font-size: 14px;
        font-weight: 700;
      }

      .reward-desc {
        font-size: 12px;
        color: var(--muted);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .stat-box {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 10px;
        text-align: center;
      }

      .stat-box-val {
        font-size: 18px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .credits-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .credit-item {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .credit-item a {
        color: var(--accent);
        text-decoration: none;
        word-break: break-all;
        font-size: 12px;
      }

      .credit-item a:hover {
        text-decoration: underline;
      }

      .btn-xs {
        padding: 4px 8px;
        font-size: 11px;
      }

      .modal-card.draft-modal {
        width: 94vw;
        max-width: 900px;
        max-height: 90vh;
        overflow-y: auto;
      }

      .draft-team-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 10px;
        margin-bottom: 12px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 7px;
      }

      .draft-chip {
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.7);
        color: var(--text);
        cursor: pointer;
      }

      .draft-chip:hover {
        background: rgba(88, 166, 255, 0.12);
      }

      .draft-chip.is-inspected {
        box-shadow: 0 0 0 1px var(--accent);
        background: rgba(88, 166, 255, 0.18);
      }

      .draft-body {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) 340px;
        gap: 14px;
        align-items: start;
      }

      .draft-roster-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        max-height: 440px;
        overflow-y: auto;
        padding-right: 4px;
      }

      .draft-roster-item {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 8px 6px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text);
        cursor: pointer;
        text-align: center;
        min-width: 0;
      }

      .draft-roster-item:hover {
        border-color: var(--border-hi);
      }

      .draft-roster-item.is-picked {
        border-color: var(--green);
        background: rgba(63, 185, 80, 0.1);
      }

      .draft-roster-item.is-picked::after {
        content: '';
        position: absolute;
        top: 5px;
        right: 5px;
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--green);
      }

      .draft-roster-item.is-inspected {
        border-color: var(--accent);
        background: rgba(88, 166, 255, 0.14);
        box-shadow: inset 0 0 0 1px rgba(88, 166, 255, 0.35);
      }

      .draft-roster-item.is-unaffordable {
        opacity: 0.55;
      }

      .draft-roster-name {
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .draft-detail-panel {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .draft-detail-panel .desc-box {
        font-size: 11px;
        line-height: 1.35;
        padding: 7px 9px;
      }

      .draft-detail-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .draft-detail-identity {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .draft-detail-title {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .draft-detail-name {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }

      .draft-detail-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
      }

      .poke-icon-wrap.lg {
        width: 40px;
        height: 40px;
      }

      .snowflake-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px;
      }

      .snowflake-svg {
        width: 100%;
        max-width: 260px;
        height: auto;
        display: block;
      }

      .snowflake-legend {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-size: 11px;
        color: var(--muted);
      }

      .snowflake-legend-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      @media (max-width: 720px) {
        .draft-body {
          grid-template-columns: 1fr;
        }
        .draft-roster-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .starter-tag {
        background: rgba(56, 189, 248, 0.16);
        color: #7dd3fc;
      }

      .locked-tag {
        background: rgba(148, 163, 184, 0.16);
        color: #94a3b8;
      }

      .draft-roster-item.is-locked {
        opacity: 0.45;
      }

      .draft-roster-item.is-locked img {
        filter: grayscale(1) brightness(0.65);
      }

      .home-modal {
        text-align: center;
        max-width: 460px;
        padding: 28px 26px;
      }

      .home-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #7dd3fc;
        background: rgba(56, 189, 248, 0.14);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 999px;
        padding: 3px 10px;
        margin-bottom: 10px;
      }

      .home-title {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #f8fafc;
        margin-bottom: 8px;
      }

      .home-subtitle {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.5;
        margin: 0 auto 16px;
      }

      .home-meta {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .home-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      .home-btn {
        min-width: 140px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 700;
      }

      .draft-cost-picked {
        background: rgba(63, 185, 80, 0.22);
        color: var(--green);
      }

      .branch-box,
      .held-box {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }

      .branch-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .branch-tag {
        background: rgba(168, 85, 247, 0.2);
        color: #d8b4fe;
      }

      .branch-chosen-desc {
        font-size: 11px;
        color: var(--muted);
      }

      .branch-list {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .branch-btn {
        text-align: left;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
        color: var(--text);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 11px;
      }

      .branch-btn:hover {
        border-color: var(--accent);
      }

      .branch-btn span {
        color: var(--muted);
      }

      .held-slots {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .held-slot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 8px;
        border-radius: 5px;
        font-size: 11px;
        border: 1px dashed var(--border);
        color: var(--muted);
      }

      .held-slot.filled {
        border-style: solid;
        background: var(--panel-alt);
        color: var(--text);
      }

      .held-remove {
        background: transparent;
        border: none;
        color: var(--red);
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
        padding: 0 3px;
      }

      .held-equip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 6px;
      }

      .shop-items-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .shop-item-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .shop-item-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 11px;
      }

      .shop-item-desc {
        color: var(--muted);
        font-size: 10px;
      }

      .side-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .side-tab-btn {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        padding: 7px 10px;
        cursor: pointer;
      }

      .side-tab-btn:hover {
        color: var(--text);
        border-color: var(--accent);
      }

      .side-tab-btn.active {
        background: rgba(88, 166, 255, 0.16);
        border-color: var(--accent);
        color: var(--text);
      }

      .team-unit-card {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 8px 9px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .team-unit-card.selected {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px rgba(88, 166, 255, 0.35);
      }

      .team-unit-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .expanded-branches-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 8px;
        margin-top: 8px;
      }

      .expanded-branch-card {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 9px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
      }

      .expanded-branch-card.chosen {
        border-color: var(--green);
        background: rgba(63, 185, 80, 0.12);
      }

      .expanded-branch-card span {
        color: var(--muted);
        font-size: 11px;
      }

      .poke-icon-wrap {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid var(--border);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .poke-icon-wrap img {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        object-fit: cover;
      }

      .relic-icons-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .relic-icon-tile {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: help;
      }

      .relic-icon-tile.upgrade {
        border-color: rgba(63, 185, 80, 0.45);
      }

      .relic-icon-tile.artifact {
        border-color: rgba(188, 140, 255, 0.45);
      }

      .relic-icon-tile:hover,
      .relic-icon-tile:focus-visible,
      .relic-icon-tile.is-active {
        border-color: var(--accent);
        background: rgba(88, 166, 255, 0.14);
        outline: none;
      }

      .relic-tooltip {
        margin-top: 6px;
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .relic-tooltip-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
      }

      .relic-icon-tile svg,
      .held-slot-icon svg {
        width: 18px;
        height: 18px;
        display: block;
      }

      .held-slots-row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .held-slot-icon {
        position: relative;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: 1px dashed var(--border);
        background: rgba(15, 23, 42, 0.5);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .held-slot-icon.filled {
        border-style: solid;
        border-color: var(--border-hi);
        background: var(--panel);
        cursor: help;
      }

      .held-slot-remove {
        position: absolute;
        top: -5px;
        right: -5px;
        width: 14px;
        height: 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--red);
        font-size: 10px;
        line-height: 12px;
        text-align: center;
        cursor: pointer;
        padding: 0;
        opacity: 0;
        transition: opacity 0.12s ease;
      }

      .held-slot-icon.filled:hover .held-slot-remove {
        opacity: 1;
      }

      .held-equip-icon-btn {
        height: 28px;
        padding: 0 6px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        display: inline-flex;
        align-items: center;
        gap: 3px;
        cursor: pointer;
        font-size: 11px;
      }

      .held-equip-icon-btn:hover {
        border-color: var(--accent);
      }

      .held-equip-icon-btn svg {
        width: 15px;
        height: 15px;
      }

      .branch-chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 4px 0;
      }

      .branch-chip {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 700;
        background: rgba(88, 166, 255, 0.14);
        color: #7dd3fc;
        border: 1px solid rgba(88, 166, 255, 0.28);
      }

      .expanded-branch-card.locked {
        opacity: 0.48;
      }

      .minor-pool-box {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }

      .minor-pool-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        margin-top: 6px;
      }

      .minor-pool-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 6px 8px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 11px;
      }

      .minor-pool-item.owned {
        border-color: rgba(56, 189, 248, 0.45);
        background: rgba(56, 189, 248, 0.08);
      }

      .minor-pool-name {
        font-weight: 600;
        color: var(--text);
      }

      .menu-backdrop {
        position: fixed;
        inset: 0;
        z-index: 45;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background:
          radial-gradient(
            circle at 50% 25%,
            rgba(56, 189, 248, 0.14),
            transparent 55%
          ),
          radial-gradient(
            circle at 20% 80%,
            rgba(63, 185, 80, 0.1),
            transparent 45%
          ),
          linear-gradient(160deg, #0b111b 0%, #0d1520 50%, #090d14 100%);
      }

      .map-select-modal {
        width: min(920px, 95vw);
        max-height: 90vh;
        overflow-y: auto;
      }

      .map-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 10px;
      }

      @media (max-width: 720px) {
        .map-grid {
          grid-template-columns: 1fr;
        }
      }

      .map-card {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition:
          border-color 0.15s ease,
          transform 0.15s ease;
      }

      .map-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      .map-card.is-selected {
        border-color: var(--green);
        box-shadow: 0 0 0 1px rgba(63, 185, 80, 0.35);
      }

      .map-preview-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 28 / 18;
        background: #1a3317;
        border-bottom: 1px solid var(--border);
      }

      .map-preview-svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .map-diff-badge {
        position: absolute;
        top: 8px;
        right: 8px;
        font-weight: 700;
      }

      .diff-beginner {
        background: rgba(63, 185, 80, 0.25);
        color: #7ee787;
        border: 1px solid rgba(63, 185, 80, 0.45);
      }

      .diff-intermediate {
        background: rgba(88, 166, 255, 0.25);
        color: #79c0ff;
        border: 1px solid rgba(88, 166, 255, 0.45);
      }

      .diff-advanced {
        background: rgba(210, 153, 34, 0.28);
        color: #f7cc45;
        border: 1px solid rgba(210, 153, 34, 0.5);
      }

      .diff-expert {
        background: rgba(248, 81, 73, 0.26);
        color: #ffa198;
        border: 1px solid rgba(248, 81, 73, 0.5);
      }

      .map-card-body {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }

      .map-card-title {
        font-size: 15px;
        font-weight: 700;
        color: #f8fafc;
      }

      .map-card-desc {
        font-size: 12px;
        color: var(--muted);
        flex: 1;
        margin-bottom: 4px;
      }

      .map-card.is-coming-soon {
        opacity: 0.65;
      }

      .map-card.is-coming-soon:hover {
        border-color: var(--border);
        transform: none;
      }

      .map-coming-soon {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: var(--muted);
        background: repeating-linear-gradient(
          -45deg,
          #121822,
          #121822 10px,
          #161d29 10px,
          #161d29 20px
        );
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="top-bar"></header>
      <main id="main-area">
        <div id="phaser-host"></div>
        <aside id="side-panel"></aside>
      </main>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
